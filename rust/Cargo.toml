[package]
name = "aegis-sdk"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Official Aegis Authentication API SDK for Rust"
license = "MIT"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["time", "rt"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"